name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_smoke:
        description: Run the isolated Electron fixture smoke after normal checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24.13 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Install the locked dependency tree
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and mock-upstream tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production entry and test-code boundary
        run: npm run verify:production

  native-smoke:
    name: Isolated Electron smoke / ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke
    needs: verify
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Linux virtual display and fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk libgtk-3-0t64 libnss3 libgbm1 libasound2t64
      - name: Linux isolated fixture smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-electron.mjs "$RUNNER_TEMP/modeldock-native-smoke" --no-build --ci-no-sandbox
      - name: Windows isolated fixture smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/smoke-electron.mjs "$env:RUNNER_TEMP/modeldock-native-smoke" --no-build
      - name: Publish fixture screenshots and validation only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-smoke-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/modeldock-native-smoke/*.png
            ${{ runner.temp }}/modeldock-native-smoke/*-validation.json
            ${{ runner.temp }}/modeldock-native-smoke/*-error.txt
